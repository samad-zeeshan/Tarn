<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarn data model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
  --db-stroke: #7c3aed; --db-fill: #ede9fe; --db-head: #ddd6fe;
  --fact-stroke: #059669; --fact-fill: #ecfdf5; --fact-head: #a7f3d0;
  --user-stroke: #0891b2; --user-fill: #cffafe; --comp-stroke: #d97706; --comp-fill: #fef3c7;
  --rel: #94a3b8; --pk: #b45309; --fk: #7c3aed; --nk: #0891b2; --note: #f8fafc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --panel: #111827; --border: #1f2937; --text: #e5e7eb; --muted: #94a3b8;
    --db-stroke: #a78bfa; --db-fill: #1e1b3a; --db-head: #2e2660;
    --fact-stroke: #34d399; --fact-fill: #0f2a22; --fact-head: #134e3a;
    --user-stroke: #22d3ee; --user-fill: #0e3440; --comp-stroke: #fbbf24; --comp-fill: #3a2a0a;
    --rel: #64748b; --pk: #fbbf24; --fk: #c4b5fd; --nk: #67e8f9; --note: #0f172a;
  }
}
:root[data-theme="dark"] {
    --bg: #0b1120; --panel: #111827; --border: #1f2937; --text: #e5e7eb; --muted: #94a3b8;
    --db-stroke: #a78bfa; --db-fill: #1e1b3a; --db-head: #2e2660;
    --fact-stroke: #34d399; --fact-fill: #0f2a22; --fact-head: #134e3a;
    --user-stroke: #22d3ee; --user-fill: #0e3440; --comp-stroke: #fbbf24; --comp-fill: #3a2a0a;
    --rel: #64748b; --pk: #fbbf24; --fk: #c4b5fd; --nk: #67e8f9; --note: #0f172a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
main { max-width: 1800px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 24px; font-weight: 700; margin: 4px 0 18px 8px; display: flex; align-items: center; gap: 12px; }
h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #0891b2; }
.frame { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; overflow-x: auto; }
svg { width: 100%; height: auto; display: block; min-width: 900px; }
.body { stroke-width: 1.6; }
.tbl .body { fill: var(--db-fill); stroke: var(--db-stroke); }
.tbl .head { fill: var(--db-head); }
.fact .body { fill: var(--fact-fill); stroke: var(--fact-stroke); stroke-width: 2.2; }
.fact .head { fill: var(--fact-head); }
.tname { font-size: 14px; font-weight: 700; fill: var(--text); }
.tnote { font-size: 10.5px; fill: var(--muted); }
.col { font-size: 12px; fill: var(--text); }
.typ { font-size: 10.5px; fill: var(--muted); }
.key { font-size: 10px; font-weight: 700; }
.kPK { fill: var(--pk); } .kFK { fill: var(--fk); } .kNK { fill: var(--nk); }
.rel { fill: none; stroke: var(--rel); stroke-width: 1.6; }
.rlabel { font-size: 11px; fill: var(--muted); }
.ptitle { font-size: 16px; font-weight: 700; fill: var(--text); }
.psub { font-size: 11px; fill: var(--muted); }
.gnode { stroke-width: 2.2; }
.user { fill: var(--user-fill); stroke: var(--user-stroke); }
.comp { fill: var(--comp-fill); stroke: var(--comp-stroke); }
.gedge { stroke: var(--text); stroke-width: 2; fill: none; }
.gname { font-size: 13px; font-weight: 700; fill: var(--text); }
.gprop { font-size: 11px; fill: var(--muted); }
.glist { font-size: 12.5px; font-weight: 700; fill: var(--text); }
.gitem { font-size: 11.5px; fill: var(--muted); }
.note { fill: var(--note); stroke: var(--border); }
.ntitle { font-size: 12.5px; font-weight: 700; fill: var(--text); }
.nitem { font-size: 11.5px; fill: var(--muted); }
.sep { stroke: var(--border); stroke-dasharray: 4 6; }
.stitle { font-size: 16px; font-weight: 700; fill: var(--text); }
</style>
</head>
<body>
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>

<g class="notes">
  <rect class="note" x="1250" y="600" width="400" height="104" rx="10"/>
  <text class="ntitle" x="1266" y="626">Why reach is not the headline</text>
  <text class="nitem" x="1266" y="648">Host C1065 is used by 28,483 accounts.</text>
  <text class="nitem" x="1266" y="666">Hubs like it put almost every host within reach</text>
  <text class="nitem" x="1266" y="684">of any account, so the choke points matter more.</text>

  <rect class="note" x="50" y="712" width="350" height="112" rx="10"/>
  <text class="ntitle" x="66" y="738">Why the fact has no hash keys</text>
  <text class="nitem" x="66" y="760">Four md5 keys on 1.05B rows came to</text>
  <text class="nitem" x="66" y="778">about 134 GB of keys that do not compress.</text>
  <text class="nitem" x="66" y="796">The fact joins on natural keys; small</text>
  <text class="nitem" x="66" y="814">dimensions keep md5 keys for the marts.</text>
</g>
